# =============================================================================
# Koyeb Service Configuration (Zero-Credit-Card Free Cloud Deployment)
# =============================================================================
app: datapilot-ai
services:
  - name: datapilot-api
    type: web
    git:
      repository: github.com/mhmd-ebrahim-1/datapilot-ai
      branch: master
      workdir: backend
      build_command: pip install -r requirements.txt
      run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    instance_type: free
    regions:
      - fra
    ports:
      - port: 8000
        path: /
    health_checks:
      - path: /health
        port: 8000
        interval: 30
        timeout: 5
    env:
      - key: APP_NAME
        value: "DataPilot AI"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "" # Set to your free Neon/Supabase PostgreSQL connection string
      - key: JWT_SECRET
        value: "datapilot-ai-jwt-secret-key-secure-at-least-32-chars"
      - key: CORS_ORIGINS
        value: "https://datapilot-ai.vercel.app,https://*.vercel.app,http://localhost:3000"
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_MODEL
        value: "gemini-2.0-flash"
      - key: GEMINI_API_KEY
        value: ""
      - key: STORAGE_PROVIDER
        value: "local"
      - key: STORAGE_PATH
        value: "./uploads"
